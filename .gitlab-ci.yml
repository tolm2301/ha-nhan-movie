image: node:20

stages:
  - lint
  - crawl
  - snapshot
  - deploy

variables:
  # Required variables to be set in GitLab CI/CD Settings:
  # VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # POSTGRES_URL_NON_POOLING (or DATABASE_URL)
  # GITLAB_ACCESS_TOKEN (for snapshot sync push)

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

deploy_vercel:
  stage: deploy
  script:
    - npm install -g vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never

daily_crawl:
  stage: crawl
  script:
    - npm ci
    - npm run crawl -- --no-snapshot
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "crawl"'
      when: always
    - when: never

hourly_snapshot:
  stage: snapshot
  script:
    - npm ci
    - npm run snapshot:movies
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.com"
    - git remote set-url origin https://oauth2:${GITLAB_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
    - git add src/lib/movies.json
    - git commit -m "chore: update snapshot [skip ci]" || echo "No changes to commit"
    - git push origin HEAD:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TARGET == "snapshot"'
      when: always
    - when: never
