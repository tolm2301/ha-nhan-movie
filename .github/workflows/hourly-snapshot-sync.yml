name: Hourly Snapshot Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-snapshot-sync
  cancel-in-progress: false

jobs:
  sync-snapshot:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING || secrets.DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require database credentials
        run: |
          if [ -z "${POSTGRES_URL_NON_POOLING:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing POSTGRES_URL_NON_POOLING or DATABASE_URL secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Refresh runtime snapshot
        run: npm run snapshot:movies

      - name: Commit snapshot changes
        run: |
          if git diff --quiet -- src/lib/movies.json; then
            echo "Snapshot unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/movies.json
          git commit -m "chore: refresh movie snapshot"
          git push origin HEAD:"$GITHUB_REF_NAME"
