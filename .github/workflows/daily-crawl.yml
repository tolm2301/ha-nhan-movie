name: Daily Crawl

# Retained only as a manual fallback; daily scheduling now runs through Vercel Cron.
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl latest movies
        run: npm run crawl 2>&1 | tee crawl.log

      - name: Upload crawl logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log-${{ github.run_id }}
          path: crawl.log
          if-no-files-found: warn
