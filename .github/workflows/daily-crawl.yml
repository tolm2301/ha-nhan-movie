name: Daily Crawl

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl latest movies
        run: npm run crawl

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- src/lib/movies.json; then
            echo "No data changes after crawl"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/movies.json
          git commit -m "chore(data): refresh crawled movies dataset"
          git push
